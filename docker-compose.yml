services:
  sqlite-init:
    image: alpine:3.22
    container_name: cv-screener-sqlite-init
    command: ["/bin/sh", "-c", "mkdir -p /data && touch /data/cv_screener.db"]
    volumes:
      - sqlite_data:/data
    restart: "no"

  qdrant:
    image: qdrant/qdrant:v1.18.1
    container_name: cv-screener-qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage

  ollama:
    image: ollama/ollama:0.24.0
    container_name: cv-screener-ollama
    gpus: all
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  ollama-pull-models:
    image: ollama/ollama:0.24.0
    profiles: ["setup"]
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      OLLAMA_HOST: http://ollama:11434
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >
        ollama pull ${GENERATION_MODEL:-gemma3:12b}

volumes:
  sqlite_data:
  qdrant_data:
  ollama_data:
